name: "CI"

on:
  workflow_dispatch:
    inputs:
      skip-tests:
        description: "Skip tests"
        type: boolean
        required: false
        default: false
      skip-version-bump:
        description: "Skip version bump"
        type: boolean
        required: false
        default: false
      force-publish:
        description: "Force publish (even without version bump)"
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: "CI"
    outputs:
      version: ${{ steps.new_releases.outputs.version }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x

      - name: Install Dependencies
        run: |
          npm install
          npm run build

      - name: Run Tests
        if: ${{ inputs.skip-tests != true }}
        run: |
          npm run test

      - name: Workspaces List
        id: workspaces
        run: |
          workspaces=(
            ".:node"
            "packages/eslint:node"
            "packages/prettier:node"
            "packages/tsconfig:node"
            "packages/vitest:node"
          )
          workspaces_string=$(IFS=','; echo "${workspaces[*]}")
          echo "workspaces=$workspaces_string"
          echo "workspaces=$workspaces_string" >> $GITHUB_OUTPUT

      - name: Version Update
        if: ${{ inputs.skip-version-bump != true }}
        id: releases
        uses: dragoscops/bumpalicious@v3
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          workspaces: ${{ steps.workspaces.outputs.workspaces }}
          pr: true
          pr_auto_merge: true

      - name: Install Task
        uses: go-task/setup-task@v1

      - name: Publish Packages
        if: ${{ ( steps.releases.outputs.tag != '' && inputs.skip-version-bump != true ) || inputs.force-publish == true }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN_W }}
        run: |
          task publish

