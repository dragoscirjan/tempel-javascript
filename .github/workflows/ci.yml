name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Mise
        uses: jdx/mise-action@v2

      - name: Clean build artifacts
        run: mise run clean

      - name: Build packages
        run: mise run build

      - name: Validate repository
        uses: ./.github/actions/validate
        with:
          executor: pnpm
          use-mise: true
          script-format: format:check
          script-lint: lint:check
          script-duplicate-check: duplicate-check
          script-test: test
          script-audit: audit

      - name: Build documentation
        run: mise run docs

  release:
    name: Release packages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create release PR or publish packages
        uses: changesets/action@v1
        with:
          # changesets writes package.json files with raw JSON.stringify,
          # which does not match the repository prettier style; reformat
          # before committing so `format:check` keeps passing.
          version: pnpm run version:modules && pnpm run format:packages
          publish: pnpm run release:modules
          title: 'chore: release packages'
          commit: 'chore(#50): release packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # The release job only runs after the quality job passes and the
          # commit content is machine-generated; skip husky hooks (they
          # require mise, which is not installed in this job).
          HUSKY: 0
