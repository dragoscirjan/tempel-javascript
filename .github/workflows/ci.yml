name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Clean build artifacts
        run: mise run clean

      - name: Build packages
        run: mise run build

      - name: Validate repository
        uses: ./.github/actions/validate
        with:
          executor: pnpm
          use-mise: true
          script-format: format:check
          script-lint: lint:check
          script-duplicate-check: duplicate-check
          script-test: test
          script-audit: audit

      - name: Build documentation
        run: mise run docs

  release:
    name: Release packages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    concurrency:
      group: npm-release
      cancel-in-progress: false
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create release PR or publish packages
        id: release
        uses: ./.github/actions/release
        with:
          config: .github/tempel-release.yml
          github-app-client-id: ${{ vars.TEMPEL_RELEASE_APP_CLIENT_ID }}
          github-app-private-key: ${{ secrets.TEMPEL_RELEASE_APP_PRIVATE_KEY }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # The release job only runs after the quality job passes and the
          # commit content is machine-generated; skip husky hooks (they
          # require mise, which is not installed in this job).
          HUSKY: 0

      - name: Validate the version pull request
        if: steps.release.outputs.pr-number != '' && vars.TEMPEL_RELEASE_APP_CLIENT_ID == ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.release.outputs.pr-number }}
        run: |
          head_ref="$(gh pr view "${PR_NUMBER}" --json headRefName --jq .headRefName)"
          gh workflow run ci.yml --ref "${head_ref}"
