name: Test release action

on:
  push:
    branches:
      - main
    paths:
      - '.github/actions/release/**'
      - '.github/workflows/test-release-action.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  pull_request:
    paths:
      - '.github/actions/release/**'
      - '.github/workflows/test-release-action.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    name: Release action (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:release-action
      - name: Verify the committed bundle
        if: runner.os == 'Linux'
        run: git diff --exit-code -- .github/actions/release/dist

  shellcheck:
    name: Release action shell checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Check Bash syntax
        run: bash -n .github/actions/release/release.spec.sh
      - name: Run ShellCheck
        run: shellcheck .github/actions/release/release.spec.sh
