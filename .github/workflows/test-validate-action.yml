name: Test validate action

on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: test-validate-action-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint action sources
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Check shell syntax
        shell: bash
        run: bash -n .github/actions/validate/validate.sh .github/actions/validate/validate.spec.sh

      - name: Run ShellCheck
        shell: bash
        run: shellcheck .github/actions/validate/validate.sh .github/actions/validate/validate.spec.sh

  shell-tests:
    name: Shell tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Run validate action tests
        shell: bash
        run: ./.github/actions/validate/validate.spec.sh
