name: Release Node packages
description: Version and publish single-package or workspace Node.js projects with Changesets.
author: dragoscops

branding:
  icon: package
  color: blue

inputs:
  config:
    description: Optional JSON or YAML release configuration path relative to the repository root.
    required: false
    default: ''
  github-token:
    description: Optional GitHub, personal access, or App installation token. Defaults to github.token.
    required: false
    default: ''
  github-app-client-id:
    description: Optional GitHub App client ID. Requires github-app-private-key.
    required: false
    default: ''
  github-app-private-key:
    description: Optional GitHub App private key. Requires github-app-client-id.
    required: false
    default: ''

outputs:
  mode:
    description: Selected release mode. The value is none, version, or publish.
    value: ${{ steps.mode.outputs.mode }}
  pr-number:
    description: Version pull request number when mode is version.
    value: ${{ steps.version.outputs.pr-number }}
  published:
    description: Whether Changesets published at least one package.
    value: ${{ steps.publish.outputs.published || 'false' }}
  published-packages:
    description: JSON array containing the published package names and versions.
    value: ${{ steps.publish.outputs.published-packages || '[]' }}

runs:
  using: composite
  steps:
    - name: Resolve release configuration
      id: config
      shell: bash
      env:
        TEMPEL_RELEASE_CONFIG: ${{ inputs.config }}
        TEMPEL_RELEASE_GITHUB_APP_CLIENT_ID_SET: ${{ inputs.github-app-client-id != '' }}
        TEMPEL_RELEASE_GITHUB_APP_PRIVATE_KEY_SET: ${{ inputs.github-app-private-key != '' }}
        TEMPEL_RELEASE_WORKSPACE: ${{ github.workspace }}
      run: node "${GITHUB_ACTION_PATH}/dist/index.js" resolve

    - name: Select release mode
      id: mode
      uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
      with:
        cwd: ${{ steps.config.outputs.cwd }}

    - name: Create GitHub App token
      id: github-app
      if: steps.mode.outputs.mode != 'none' && steps.config.outputs.use-github-app == 'true'
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
      with:
        client-id: ${{ inputs.github-app-client-id }}
        private-key: ${{ inputs.github-app-private-key }}
        permission-contents: write
        permission-pull-requests: write

    - name: Create or update version pull request
      id: version
      if: steps.mode.outputs.mode == 'version'
      uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
      env:
        TEMPEL_RELEASE_CONFIG: ${{ inputs.config }}
        TEMPEL_RELEASE_WORKSPACE: ${{ github.workspace }}
      with:
        github-token: ${{ steps.github-app.outputs.token || inputs.github-token || github.token }}
        script: node "${{ github.action_path }}/dist/index.js" version
        commit-message: ${{ steps.config.outputs.commit-message }}
        pr-title: ${{ steps.config.outputs.pr-title }}
        pr-base-branch: ${{ steps.config.outputs.pr-base-branch }}
        pr-draft: ${{ steps.config.outputs.pr-draft }}
        cwd: ${{ steps.config.outputs.cwd }}

    - name: Publish changed packages
      id: publish
      if: steps.mode.outputs.mode == 'publish'
      uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
      env:
        TEMPEL_RELEASE_CONFIG: ${{ inputs.config }}
        TEMPEL_RELEASE_WORKSPACE: ${{ github.workspace }}
      with:
        github-token: ${{ steps.github-app.outputs.token || inputs.github-token || github.token }}
        script: node "${{ github.action_path }}/dist/index.js" publish
        create-github-releases: ${{ steps.config.outputs.create-github-releases }}
        push-git-tags: ${{ steps.config.outputs.push-git-tags }}
        cwd: ${{ steps.config.outputs.cwd }}

    - name: Write release summary
      if: always()
      shell: bash
      env:
        TEMPEL_RELEASE_MODE: ${{ steps.mode.outputs.mode }}
        TEMPEL_RELEASE_PR_NUMBER: ${{ steps.version.outputs.pr-number }}
        TEMPEL_RELEASE_PUBLISHED: ${{ steps.publish.outputs.published }}
        TEMPEL_RELEASE_PUBLISHED_PACKAGES: ${{ steps.publish.outputs.published-packages }}
      run: node "${GITHUB_ACTION_PATH}/dist/index.js" summary
